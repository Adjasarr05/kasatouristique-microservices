spring.application.name=patrimoine-ziguinchor
server.port=8080

# === Base de donnees H2 en memoire (prete a demarrer sans XAMPP) ===
spring.datasource.url=jdbc:h2:mem:patrimoinedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=never
spring.thymeleaf.cache=false

# === URLs des 7 Microservices du TP1 ===
microservices.patrimoine.url=http://localhost:8081
microservices.circuit.url=http://localhost:8082
microservices.evenement.url=http://localhost:8083
microservices.reservation.url=http://localhost:8084
microservices.utilisateur.url=http://localhost:8085
microservices.paiement.url=http://localhost:8086
microservices.notification.url=http://localhost:8087

