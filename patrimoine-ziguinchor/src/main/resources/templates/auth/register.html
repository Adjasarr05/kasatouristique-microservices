<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Inscription')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="kasa-auth-section">
    <div class="container">
        <div class="kasa-auth-card">
            <div class="text-center mb-4">
                <div class="fs-5 mb-1">
                    <span class="brand-kasa">Kasa</span><span class="brand-touristique">Touristique</span>
                </div>
                <h2 class="fw-bold mb-1">Créer un compte</h2>
                <p class="small text-muted mb-0">Rejoignez la plateforme touristique de Ziguinchor et de la Casamance</p>
            </div>

            <div class="alert alert-danger small" th:if="${erreurEmail}" th:text="${erreurEmail}"></div>

            <form th:action="@{/register}" th:object="${user}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nom complet</label>
                    <input type="text" th:field="*{nom}" class="form-control" placeholder="Ex : Aminata Sonko"/>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="exemple@ziguinchor.sn"/>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Mot de passe</label>
                    <input type="password" th:field="*{motDePasse}" class="form-control" placeholder="Minimum 6 caractères"/>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('motDePasse')}" th:errors="*{motDePasse}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Je m'inscris en tant que :</label>
                    <select name="roleChoisi" id="roleChoisi" class="form-select" onchange="toggleGuideFields()">
                        <option value="VISITEUR">Visiteur / Touriste</option>
                        <option value="GUIDE">Guide touristique (soumis à validation)</option>
                        <option value="OPERATEUR_TOURISTIQUE">Opérateur touristique</option>
                    </select>
                </div>

                <div id="guideExtraFields" class="p-3 rounded-3 bg-light border mb-3" style="display: none;">
                    <p class="small fw-semibold text-success mb-2">Informations professionnelles du guide</p>
                    <div class="mb-2">
                        <input type="text" th:field="*{telephone}" class="form-control form-control-sm" placeholder="Téléphone (ex: +221 77 ...)"/>
                    </div>
                    <div class="mb-2">
                        <input type="text" th:field="*{specialite}" class="form-control form-control-sm" placeholder="Spécialité (ex: Histoire, Écotourisme...)"/>
                    </div>
                    <div class="mb-0">
                        <input type="text" th:field="*{languesParlees}" class="form-control form-control-sm" placeholder="Langues parlées (ex: Français, Diola, Anglais)"/>
                    </div>
                </div>
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-kasa-gold rounded-pill py-2 d-flex align-items-center justify-content-center fw-semibold">
                        Créer un compte
                    </button>
                    <a th:href="@{/login}" class="btn btn-outline-gold rounded-pill py-2 d-flex align-items-center justify-content-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-person-circle me-2" viewBox="0 0 16 16">
                            <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
                            <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z"/>
                        </svg>
                        <span>Connexion</span>
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
function toggleGuideFields() {
    var sel = document.getElementById('roleChoisi');
    var box = document.getElementById('guideExtraFields');
    if (sel && box) {
        box.style.display = sel.value === 'GUIDE' ? 'block' : 'none';
    }
}
</script>
</body>
</html>
