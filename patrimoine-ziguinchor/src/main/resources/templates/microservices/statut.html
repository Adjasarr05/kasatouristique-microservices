<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Architecture Microservices')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Architecture Microservices</h2>
            <p class="text-muted mb-0">
                Supervision en direct des 7 microservices REST Spring Boot et de leurs bases H2 dédiées.
            </p>
        </div>
        <div class="text-end">
            <span class="badge bg-success fs-6" th:text="${nbEnLigne} + ' / ' + ${nbTotal} + ' en ligne'">7 / 7 en ligne</span>
            <a th:href="@{/microservices}" class="btn btn-outline-success btn-sm ms-2">Actualiser</a>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-6 col-lg-4" th:each="ms : ${statuts}">
            <div class="card h-100 shadow-sm" th:classappend="${ms.enLigne} ? 'border-success' : 'border-secondary'">
                <div class="card-header d-flex justify-content-between align-items-center"
                     th:classappend="${ms.enLigne} ? 'bg-success text-white' : 'bg-light'">
                    <strong th:text="${ms.nom}">ms-patrimoine</strong>
                    <span class="badge"
                          th:classappend="${ms.enLigne} ? 'bg-light text-success' : 'bg-secondary'"
                          th:text="${ms.enLigne} ? 'EN LIGNE' : 'HORS LIGNE'">HORS LIGNE</span>
                </div>
                <div class="card-body">
                    <p class="card-text small" th:text="${ms.description}">Description du microservice</p>
                    <ul class="list-unstyled small mb-0">
                        <li><strong>Port :</strong> <span th:text="${ms.port}">8081</span></li>
                        <li>
                            <strong>Endpoint :</strong>
                            <a th:href="'http://localhost:' + ${ms.port} + ${ms.endpoint}" target="_blank"
                               th:text="'http://localhost:' + ${ms.port} + ${ms.endpoint}">http://localhost:8081/api/patrimoines</a>
                        </li>
                        <li th:if="${ms.enLigne}">
                            <strong>Enregistrements :</strong>
                            <span class="badge bg-info text-dark" th:text="${ms.nombreEnregistrements}">0</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
