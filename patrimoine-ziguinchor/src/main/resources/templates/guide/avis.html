<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Avis et modération')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<section class="page-banner">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
        <div>
            <h1 class="h2 fw-bold mb-1">Avis des visiteurs &amp; Réponses</h1>
            <p class="mb-0 text-white-50">Consultez les commentaires, répondez aux voyageurs et signalez tout avis abusif.</p>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/guide/agenda}" class="btn btn-outline-light rounded-pill px-3">Mon agenda</a>
            <a th:href="@{/guide/profil}" class="btn btn-gold rounded-pill px-3">Mon profil pro</a>
        </div>
    </div>
</section>

<main class="container mb-5">
    <div class="alert alert-success rounded-4" th:if="${messageSucces}" th:text="${messageSucces}"></div>

    <div class="row g-4">
        <div class="col-md-6" th:each="a : ${avisList}">
            <div class="feature-card p-4 h-100 d-flex flex-column justify-content-between">
                <div>
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="badge bg-success-subtle text-success rounded-pill px-3 py-2"
                              th:text="${a.siteTouristique != null ? a.siteTouristique.nom : 'Site touristique'}">Site</span>
                        <span class="text-warning fw-bold" th:text="${#strings.repeat('★', a.note)}">★★★★★</span>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <strong th:text="${a.auteur}">Auteur</strong>
                        <small class="text-muted" th:text="${a.dateAvis}">Date</small>
                    </div>
                    <p class="small text-secondary mb-2" th:text="${a.commentaire}">Commentaire</p>

                    <div th:if="${a.reponseGuide != null and !a.reponseGuide.isBlank()}" class="p-2 rounded-3 bg-light border-start border-3 border-success small mb-3">
                        <strong class="text-success" th:text="${a.auteurReponse != null ? a.auteurReponse : 'Guide'}">Guide</strong> :
                        <span th:text="${a.reponseGuide}">Réponse</span>
                    </div>
                </div>

                <div class="pt-3 border-top">
                    <form th:action="@{/avis/{id}/repondre(id=${a.id})}" method="post" class="d-flex gap-2 mb-2">
                        <input type="hidden" name="provenance" value="guide"/>
                        <input type="text" name="reponseGuide" class="form-control form-control-sm"
                               th:value="${a.reponseGuide}" placeholder="Écrire une réponse au visiteur..." required/>
                        <button type="submit" class="btn btn-sm btn-success rounded-pill px-3">Répondre</button>
                    </form>

                    <div class="d-flex justify-content-between align-items-center">
                        <span th:if="${a.signale}" class="badge bg-danger rounded-pill">🚩 Signalé pour modération</span>
                        <form th:unless="${a.signale}" th:action="@{/avis/{id}/signaler(id=${a.id})}" method="post" class="d-flex gap-2 w-100">
                            <input type="hidden" name="provenance" value="guide"/>
                            <input type="text" name="motif" class="form-control form-control-sm" placeholder="Motif du signalement (optionnel)"/>
                            <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill px-3"
                                    onclick="return confirm('Signaler cet avis comme abusif ?');">Signaler</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
