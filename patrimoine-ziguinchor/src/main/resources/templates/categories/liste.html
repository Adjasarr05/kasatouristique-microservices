<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: pageHead('Catégories')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<section class="page-banner">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
        <div>
            <h1 class="h2 fw-bold mb-1">Catégories du patrimoine casamançais</h1>
            <p class="mb-0 text-white-50">Explorez les richesses culturelles, naturelles, spirituelles et historiques de la région.</p>
        </div>
        <a sec:authorize="hasAnyRole('CONSERVATEUR','ADMINISTRATEUR_COMMUNAL','SUPER_ADMIN')" th:href="@{/categories/nouveau}" class="btn btn-gold rounded-pill px-4">+ Nouvelle catégorie</a>
    </div>
</section>

<main class="container mb-5">
    <div class="row g-4">
        <div class="col-md-6" th:each="cat : ${categories}">
            <div class="feature-card p-4 h-100 d-flex flex-column justify-content-between">
                <div>
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h4 class="fw-bold mb-0 text-success" th:text="${cat.nom}">Catégorie</h4>
                        <span class="badge bg-success-subtle text-success rounded-pill px-3 py-2"
                              th:text="${#lists.size(cat.sites)} + ' site(s)'">0 site(s)</span>
                    </div>
                    <p class="text-muted mb-3" th:text="${cat.description}">Description</p>
                </div>
                <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                    <a th:href="@{/sites(categorie=${cat.id})}" class="btn btn-success btn-sm rounded-pill px-3">
                        Découvrir les sites &rarr;
                    </a>
                    <div class="d-flex gap-2" sec:authorize="hasAnyRole('CONSERVATEUR','ADMINISTRATEUR_COMMUNAL','SUPER_ADMIN')">
                        <a th:href="@{/categories/modifier/{id}(id=${cat.id})}" class="btn btn-sm btn-outline-primary rounded-pill">Modifier</a>
                        <a th:href="@{/categories/supprimer/{id}(id=${cat.id})}" class="btn btn-sm btn-outline-danger rounded-pill"
                           onclick="return confirm('Supprimer cette catégorie ?');">Supprimer</a>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(categories)}" class="col-12 text-center text-muted py-5">
            Aucune catégorie enregistrée.
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
