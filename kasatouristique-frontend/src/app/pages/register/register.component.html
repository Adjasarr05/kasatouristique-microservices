<main class="kasa-auth-section">
  <div class="container">
    <div class="kasa-auth-card">
      <div class="text-center mb-4">
        <div class="fs-5 mb-1">
          <span class="brand-kasa">Kasa</span><span class="brand-touristique">Touristique</span>
        </div>
        <h2 class="fw-bold mb-1 text-white">Créer un compte</h2>
        <p class="small text-muted mb-0">Rejoignez la plateforme touristique de Ziguinchor et de la Casamance</p>
      </div>

      <div class="alert alert-success small rounded-4" *ngIf="message">{{ message }}</div>
      <div class="alert alert-danger small rounded-4" *ngIf="erreur">{{ erreur }}</div>

      <form (ngSubmit)="sInscrire()">
        <div class="mb-3">
          <label class="form-label fw-semibold text-light small">Nom complet</label>
          <input type="text" class="form-control rounded-pill" [(ngModel)]="nom" name="nom" required placeholder="Ex : Aminata Sonko"/>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold text-light small">Email</label>
          <input type="email" class="form-control rounded-pill" [(ngModel)]="email" name="email" required placeholder="exemple@ziguinchor.sn"/>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold text-light small">Mot de passe</label>
          <input type="password" class="form-control rounded-pill" [(ngModel)]="motDePasse" name="motDePasse" required placeholder="Minimum 6 caractères"/>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold text-light small">Je m'inscris en tant que :</label>
          <select class="form-select rounded-pill" [(ngModel)]="roleChoisi" name="roleChoisi">
            <option value="VISITEUR">Visiteur / Touriste</option>
            <option value="GUIDE">Guide touristique (soumis à validation)</option>
            <option value="OPERATEUR_TOURISTIQUE">Opérateur touristique</option>
          </select>
        </div>

        <div *ngIf="roleChoisi === 'GUIDE'" class="p-3 rounded-3 bg-light border mb-3">
          <p class="small fw-semibold text-success mb-2">Informations professionnelles du guide</p>
          <div class="mb-2">
            <input type="text" class="form-control form-control-sm rounded-pill" [(ngModel)]="specialite" name="specialite" placeholder="Spécialité (ex: Histoire, Écotourisme...)"/>
          </div>
        </div>

        <div class="d-grid gap-2 mt-4">
          <button type="submit" class="btn btn-kasa-gold rounded-pill py-2 d-flex align-items-center justify-content-center fw-semibold">
            Créer un compte
          </button>
          <a routerLink="/login" class="btn btn-outline-gold rounded-pill py-2 d-flex align-items-center justify-content-center">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-person-circle me-2" viewBox="0 0 16 16">
              <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
              <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z"/>
            </svg>
            <span>Connexion</span>
          </a>
        </div>
      </form>
    </div>
  </div>
</main>
