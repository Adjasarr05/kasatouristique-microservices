<section class="page-banner">
  <div class="container d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
    <div>
      <h1 class="h2 fw-bold mb-1">Catégories du patrimoine casamançais</h1>
      <p class="mb-0 text-white-50">Explorez les richesses culturelles, naturelles, spirituelles et historiques de la région.</p>
    </div>
  </div>
</section>

<main class="container mb-5">
  <div class="row g-4">
    <div class="col-md-6" *ngFor="let cat of categories">
      <div class="feature-card p-4 h-100 d-flex flex-column justify-content-between">
        <div>
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h4 class="fw-bold mb-0 text-success">{{ cat.nom }}</h4>
            <span class="badge bg-success-subtle text-success rounded-pill px-3 py-2">
              {{ cat.nbSites }} site(s)
            </span>
          </div>
          <p class="text-muted mb-3">{{ cat.description }}</p>
        </div>
        <div class="d-flex justify-content-between align-items-center pt-2 border-top">
          <a [routerLink]="['/catalogue']" [queryParams]="{categorie: cat.nom}" class="btn btn-success btn-sm rounded-pill px-3">
            Découvrir les sites &rarr;
          </a>
        </div>
      </div>
    </div>
  </div>
</main>
