server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy direct vers les 7 microservices REST dans le réseau Docker
    location /api/patrimoines {
        proxy_pass http://ms-patrimoine:8081;
    }
    location /api/categories {
        proxy_pass http://ms-patrimoine:8081;
    }
    location /api/circuits {
        proxy_pass http://ms-circuit:8082;
    }
    location /api/evenements {
        proxy_pass http://ms-evenement:8083;
    }
    location /api/reservations {
        proxy_pass http://ms-reservation:8084;
    }
    location /api/utilisateurs {
        proxy_pass http://ms-utilisateur:8085;
    }
    location /api/paiements {
        proxy_pass http://ms-paiement:8086;
    }
    location /api/notifications {
        proxy_pass http://ms-notification:8087;
    }
}
