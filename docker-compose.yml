services:
  ms-patrimoine:
    build:
      context: ./ms-patrimoine
      dockerfile: Dockerfile
    container_name: ms-patrimoine
    ports:
      - "8081:8081"
    networks:
      - kasatouristique-net
    restart: unless-stopped

  ms-circuit:
    build:
      context: ./ms-circuit
      dockerfile: Dockerfile
    container_name: ms-circuit
    ports:
      - "8082:8082"
    environment:
      - MICROSERVICES_PATRIMOINE_URL=http://ms-patrimoine:8081
    depends_on:
      - ms-patrimoine
    networks:
      - kasatouristique-net
    restart: unless-stopped

  ms-evenement:
    build:
      context: ./ms-evenement
      dockerfile: Dockerfile
    container_name: ms-evenement
    ports:
      - "8083:8083"
    environment:
      - MICROSERVICES_PATRIMOINE_URL=http://ms-patrimoine:8081
      - MICROSERVICES_CIRCUIT_URL=http://ms-circuit:8082
    depends_on:
      - ms-patrimoine
      - ms-circuit
    networks:
      - kasatouristique-net
    restart: unless-stopped

  ms-utilisateur:
    build:
      context: ./ms-utilisateur
      dockerfile: Dockerfile
    container_name: ms-utilisateur
    ports:
      - "8085:8085"
    networks:
      - kasatouristique-net
    restart: unless-stopped

  ms-paiement:
    build:
      context: ./ms-paiement
      dockerfile: Dockerfile
    container_name: ms-paiement
    ports:
      - "8086:8086"
    networks:
      - kasatouristique-net
    restart: unless-stopped

  ms-notification:
    build:
      context: ./ms-notification
      dockerfile: Dockerfile
    container_name: ms-notification
    ports:
      - "8087:8087"
    networks:
      - kasatouristique-net
    restart: unless-stopped

  ms-reservation:
    build:
      context: ./ms-reservation
      dockerfile: Dockerfile
    container_name: ms-reservation
    ports:
      - "8084:8084"
    environment:
      - MICROSERVICES_CIRCUIT_URL=http://ms-circuit:8082
      - MICROSERVICES_EVENEMENT_URL=http://ms-evenement:8083
      - MICROSERVICES_UTILISATEUR_URL=http://ms-utilisateur:8085
      - MICROSERVICES_PAIEMENT_URL=http://ms-paiement:8086
      - MICROSERVICES_NOTIFICATION_URL=http://ms-notification:8087
    depends_on:
      - ms-circuit
      - ms-evenement
      - ms-utilisateur
      - ms-paiement
      - ms-notification
    networks:
      - kasatouristique-net
    restart: unless-stopped

  patrimoine-web:
    build:
      context: ./patrimoine-ziguinchor
      dockerfile: Dockerfile
    container_name: patrimoine-web
    ports:
      - "8080:8080"
    environment:
      - MICROSERVICES_PATRIMOINE_URL=http://ms-patrimoine:8081
      - MICROSERVICES_CIRCUIT_URL=http://ms-circuit:8082
      - MICROSERVICES_EVENEMENT_URL=http://ms-evenement:8083
      - MICROSERVICES_RESERVATION_URL=http://ms-reservation:8084
      - MICROSERVICES_UTILISATEUR_URL=http://ms-utilisateur:8085
      - MICROSERVICES_PAIEMENT_URL=http://ms-paiement:8086
      - MICROSERVICES_NOTIFICATION_URL=http://ms-notification:8087
    depends_on:
      - ms-patrimoine
      - ms-circuit
      - ms-evenement
      - ms-reservation
      - ms-utilisateur
      - ms-paiement
      - ms-notification
    networks:
      - kasatouristique-net
    restart: unless-stopped

  frontend-angular:
    build:
      context: ./kasatouristique-frontend
      dockerfile: Dockerfile
    container_name: frontend-angular
    ports:
      - "4200:80"
    depends_on:
      - ms-patrimoine
      - ms-circuit
      - ms-evenement
      - ms-reservation
      - ms-utilisateur
      - ms-paiement
      - ms-notification
    networks:
      - kasatouristique-net
    restart: unless-stopped

networks:
  kasatouristique-net:
    driver: bridge
